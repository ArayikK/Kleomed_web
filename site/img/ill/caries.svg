<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Разрез зуба: эмаль, дентин, пульпа и кариозная полость">
  <title>Лечение кариеса</title>
  <defs>
    <clipPath id="fit"><circle cx="240" cy="240" r="212"/></clipPath>
    <!-- силуэт коронки: два бугра сверху, шейка у десны -->
    <path id="ca-crown" d="M150 306C141 212 161 128 194 108c17-10 32 12 41 29 6 12 16 12 22 0 9-17 24-39 41-29 33 20 53 104 44 198z"/>
    <clipPath id="ca-in"><use href="#ca-crown"/></clipPath>
    <linearGradient id="ca-en" x1=".3" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#DCF2E7"/>
    </linearGradient>
  </defs>

  <circle cx="240" cy="240" r="214" fill="#fff" opacity=".07"/>
  <g clip-path="url(#fit)">

    <!-- десна -->
    <path d="M10 306c44-16 82-20 120-13 28 5 48 6 66 1 20-5 32-15 52-15s32 10 52 15c18 5 38 4 66-1 38-7 76-3 120 13v130H10z"
          fill="#fff" fill-opacity=".16"/>
    <path d="M10 306c44-16 82-20 120-13 28 5 48 6 66 1 20-5 32-15 52-15s32 10 52 15c18 5 38 4 66-1 38-7 76-3 120 13"
          fill="none" stroke="#fff" stroke-opacity=".34" stroke-width="2"/>

    <g transform="translate(234,306) scale(1.25) translate(-240,-306)">
    <!-- корни под десной -->
    <g fill="#fff" fill-opacity=".13">
      <path d="M166 306h64l-11 96c-2 17-12 28-21 28s-19-11-21-28z"/>
      <path d="M250 306h64l-11 96c-2 17-12 28-21 28s-19-11-21-28z"/>
    </g>

    <!-- эмаль -->
    <use href="#ca-crown" fill="url(#ca-en)"/>

    <g clip-path="url(#ca-in)">
      <!-- дентин -->
      <path d="M176 320C168 226 186 152 210 138c13-8 24 9 30 22 5 10 12 10 17 0 6-13 17-30 30-22 24 14 42 88 34 182z"
            fill="#A6EEC8"/>
      <!-- пульпа: камера и каналы -->
      <path d="M210 330c-6-70 4-124 20-136 6-4 11 6 14 13 3-7 8-17 14-13 16 12 26 66 20 136z" fill="#4FB98C"/>
      <path d="M226 300v120M254 300v120" stroke="#4FB98C" stroke-width="11" stroke-linecap="round"/>

      <!-- кариозная полость: разрушение сквозь эмаль в дентин -->
      <path d="M150 130c26-16 56-6 62 16 6 21-8 40-30 47-23 7-44-2-49-22-4-17 2-32 17-41z" fill="#0A2B20"/>
      <path d="M196 186c-10 10-9 24 2 31 8 5 17 3 22-4" fill="none" stroke="#0A2B20" stroke-width="9" stroke-linecap="round"/>
      <g fill="#0A2B20" fill-opacity=".55">
        <circle cx="214" cy="228" r="5"/><circle cx="200" cy="244" r="3.5"/><circle cx="224" cy="248" r="3"/>
      </g>
    </g>

    <!-- кромка полости на поверхности -->
    <path d="M150 130c26-16 56-6 62 16 6 21-8 40-30 47-23 7-44-2-49-22" fill="none"
          stroke="#fff" stroke-opacity=".55" stroke-width="2.5" clip-path="url(#ca-in)"/>
    <use href="#ca-crown" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2.5"/>
    </g>

  </g>
  <circle cx="240" cy="240" r="214" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="5 9"/>
</svg>
