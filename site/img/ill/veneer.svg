<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Тонкая керамическая пластинка на передней поверхности зуба">
  <title>Виниры и люминиры</title>
  <defs>
    <clipPath id="fit"><circle cx="240" cy="240" r="212"/></clipPath>
    <!-- резец: сужается к шейке, скруглён к режущему краю -->
    <path id="vn-t" d="M-52 8C-52 0-47-6-40-6H40C47-6 52 0 52 8
                       C54 62 52 112 45 144 C38 178 21 196 0 196
                       C-21 196-38 178-45 144 C-52 112-54 62-52 8Z"/>
    <linearGradient id="vn-old" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2D6CB"/><stop offset="1" stop-color="#8AA99A"/>
    </linearGradient>
    <linearGradient id="vn-new" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#F6FFFA"/><stop offset="1" stop-color="#CDF2DF"/>
    </linearGradient>
  </defs>

  <circle cx="240" cy="240" r="214" fill="#fff" opacity=".07"/>
  <g clip-path="url(#fit)">

    <!-- десна сверху -->
    <path d="M20 130c40-14 74-18 110-11 26 5 44 6 62 1 18-5 30-14 48-14s30 9 48 14c18 5 36 4 62-1 36-7 70-3 110 11V16H20z"
          fill="#fff" fill-opacity=".16"/>
    <path d="M20 130c40-14 74-18 110-11 26 5 44 6 62 1 18-5 30-14 48-14s30 9 48 14c18 5 36 4 62-1 36-7 70-3 110 11"
          fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="2"/>

    <!-- свой зуб: тусклый, с потемнением и сколом -->
    <g transform="translate(300,132)">
      <use href="#vn-t" fill="url(#vn-old)"/>
      <use href="#vn-t" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>
      <path d="M-24 44c-5 28-5 68 0 96" stroke="#68887A" stroke-opacity=".5" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M52 150c-4 20-14 34-30 40" stroke="#68887A" stroke-opacity=".45" stroke-width="9" stroke-linecap="round" fill="none"/>
    </g>

    <!-- винир: тот же силуэт, повёрнут и смещён вперёд -->
    <g transform="translate(198,150) rotate(-7)">
      <!-- торец пластинки: видно, что она тонкая -->
      <path d="M52 8C54 62 52 112 45 144 38 178 21 196 0 196" fill="none" stroke="#7FDFB2" stroke-width="14" stroke-linecap="round"/>
      <use href="#vn-t" fill="url(#vn-new)"/>
      <use href="#vn-t" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2.5"/>
      <path d="M-30 26c-7 24-8 66-4 100" stroke="#fff" stroke-opacity=".8" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M4 40c-4 16-5 40-3 58" stroke="#fff" stroke-opacity=".45" stroke-width="7" stroke-linecap="round" fill="none"/>
    </g>

    <!-- искры -->
    <g fill="#fff">
      <path d="M128 122l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill-opacity=".9"/>
      <path d="M110 256l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill-opacity=".55"/>
      <path d="M398 206l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill-opacity=".7"/>
    </g>

  </g>
  <circle cx="240" cy="240" r="214" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="5 9"/>
</svg>
