<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Схема винира: тонкая керамическая пластинка накладывается на переднюю поверхность зуба">
  <title>Виниры и люминиры</title>
  <defs>
    <linearGradient id="vn-fx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/><stop offset=".16" stop-color="#fff"/>
      <stop offset=".84" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="vn-mx"><rect width="480" height="480" fill="url(#vn-fx)"/></mask>
    <!-- контур резца -->
    <path id="vn-shape" d="M-52 0h104c9 0 15 7 14 16l-11 116c-3 30-21 48-55 48s-52-18-55-48L-66 16c-1-9 5-16 14-16z"/>
  </defs>

  <circle cx="240" cy="240" r="214" fill="#fff" opacity=".07"/>
  <circle cx="240" cy="240" r="214" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="5 9"/>

  <!-- ================= десна сверху, зуб растёт вниз ================= -->
  <g mask="url(#vn-mx)">
    <path d="M40 128c30-14 54-16 80-10 24 5 40 6 61 1 19-4 30-13 59-13s40 9 59 13c21 5 37 4 61-1 26-6 50-4 80 10v34c-30-14-54-16-80-10-24 5-40 6-61 1-19-4-30-13-59-13s-40 9-59 13c-21 5-37 4-61-1-26-6-50-4-80 10z"
          fill="#fff" fill-opacity=".24" stroke="#fff" stroke-opacity=".34" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- ================= свой зуб ================= -->
  <g transform="translate(272,158)">
    <use href="#vn-shape" fill="#8FC9D6" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linejoin="round"/>
    <!-- потемнение и скол, которые закрывает винир -->
    <path d="M-30 40c-4 20-4 52 0 74" stroke="#0B4E5A" stroke-opacity=".22" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M18 52c-3 16-3 40 0 58" stroke="#0B4E5A" stroke-opacity=".16" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M52 132l-16 12 14 10" fill="none" stroke="#0B4E5A" stroke-opacity=".28" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- ================= винир перед зубом ================= -->
  <!-- пластинка смещена и повёрнута: видно, что она накладывается спереди -->
  <g transform="translate(206,192) rotate(-9)">
    <use href="#vn-shape" fill="#fff" fill-opacity=".97" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- толщина керамики по нижнему краю -->
    <path d="M66 16l-11 116c-3 30-21 48-55 48" fill="none" stroke="#9FE0EE" stroke-width="8" stroke-linecap="round"/>
    <!-- блики -->
    <path d="M-30 26c-5 18-6 50-3 78" stroke="#0D7C8C" stroke-opacity=".15" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M6 34c-3 12-4 30-2 44" stroke="#0D7C8C" stroke-opacity=".09" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- искры: эффект белоснежной улыбки -->
  <g fill="#fff" fill-opacity=".85">
    <path d="M396 122l4.5 12 12 4.5-12 4.5-4.5 12-4.5-12-12-4.5 12-4.5z"/>
    <path d="M428 172l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path d="M366 84l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z"/>
  </g>

  <!-- ================= выноски ================= -->
  <g stroke="#fff" stroke-opacity=".5" stroke-width="1.5" fill="none" stroke-dasharray="4 5">
    <path d="M196 372v42"/>
    <path d="M346 244h34"/>
  </g>
  <g fill="#fff"><circle cx="196" cy="418" r="4"/><circle cx="384" cy="244" r="4"/></g>
  <g fill="#fff" fill-opacity=".9" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" font-weight="600">
    <text x="196" y="442" text-anchor="middle">Винир 0,3 мм</text>
    <text x="394" y="249">Свой зуб</text>
  </g>
</svg>
