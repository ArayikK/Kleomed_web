<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Схема зубной коронки: коронка устанавливается на обточенный зуб">
  <title>Зубные коронки</title>
  <defs>
    <linearGradient id="cr-fx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/><stop offset=".16" stop-color="#fff"/>
      <stop offset=".84" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="cr-mx"><rect width="480" height="480" fill="url(#cr-fx)"/></mask>
  </defs>

  <circle cx="240" cy="240" r="214" fill="#fff" opacity=".07"/>
  <circle cx="240" cy="240" r="214" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="5 9"/>

  <!-- ================= десна и корень ================= -->
  <g mask="url(#cr-mx)">
    <!-- корень под десной -->
    <path d="M212 306h56l-8 92c-1 12-10 20-20 20s-19-8-20-20z"
          fill="#fff" fill-opacity=".18" stroke="#fff" stroke-opacity=".3" stroke-width="2" stroke-linejoin="round"/>
    <!-- десневой валик -->
    <path d="M40 320c30-18 54-20 80-13 24 6 40 7 61 1 19-5 30-16 59-16s40 11 59 16c21 6 37 5 61-1 26-7 50-5 80 13v34c-30-18-54-20-80-13-24 6-40 7-61 1-19-5-30-16-59-16s-40 11-59 16c-21 6-37 5-61-1-26-7-50-5-80 13z"
          fill="#fff" fill-opacity=".26" stroke="#fff" stroke-opacity=".36" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- ================= обточенный зуб (культя) ================= -->
  <path d="M204 236c0-14 8-22 20-24h32c12 2 20 10 20 24l-6 76h-60z"
        fill="#9FE0EE" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- уступ под край коронки -->
  <path d="M198 312h84" stroke="#fff" stroke-opacity=".65" stroke-width="3" stroke-linecap="round"/>

  <!-- ================= коронка ================= -->
  <g>
    <!-- полая внутренняя часть -->
    <ellipse cx="240" cy="176" rx="62" ry="15" fill="#0B4E5A" fill-opacity=".5"/>
    <!-- корпус коронки -->
    <path d="M178 176c-5-34 4-64 23-74 12-6 21 7 29 19 6 9 14 9 20 0 8-12 17-25 29-19 19 10 28 40 23 74
             a62 15 0 0 1-124 0z"
          fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <!-- фиссуры -->
    <g stroke="#0D7C8C" stroke-opacity=".26" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M223 122c7 9 27 9 34 0"/><path d="M240 129v34"/>
    </g>
    <!-- блик на керамике -->
    <path d="M200 118c-7 9-11 26-11 46" stroke="#0D7C8C" stroke-opacity=".15" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- край коронки -->
    <ellipse cx="240" cy="176" rx="62" ry="15" fill="none" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- ================= стрелка посадки ================= -->
  <g stroke="#fff" stroke-opacity=".65" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M240 200v20" stroke-dasharray="5 6"/>
    <path d="M232 214l8 9 8-9"/>
  </g>

  <!-- ================= выноски ================= -->
  <g stroke="#fff" stroke-opacity=".5" stroke-width="1.5" fill="none" stroke-dasharray="4 5">
    <path d="M304 132h58"/><path d="M286 270h76"/>
  </g>
  <g fill="#fff"><circle cx="366" cy="132" r="4"/><circle cx="366" cy="270" r="4"/></g>
  <g fill="#fff" fill-opacity=".9" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" font-weight="600">
    <text x="378" y="137">Коронка</text>
    <text x="378" y="275">Свой зуб</text>
  </g>
</svg>
