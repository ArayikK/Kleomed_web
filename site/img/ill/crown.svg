<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Коронка устанавливается на обточенный зуб">
  <title>Зубные коронки</title>
  <defs>
    <clipPath id="fit"><circle cx="240" cy="240" r="212"/></clipPath>
    <linearGradient id="cr-en" x1=".25" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#F2FFF8"/><stop offset="1" stop-color="#CDEEDD"/>
    </linearGradient>
    <linearGradient id="cr-st" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A6EEC8"/><stop offset="1" stop-color="#5CBF92"/>
    </linearGradient>
  </defs>

  <circle cx="240" cy="240" r="214" fill="#fff" opacity=".07"/>
  <g clip-path="url(#fit)">

    <!-- десна -->
    <path d="M14 332c42-16 78-20 116-13 28 5 46 6 64 1 20-5 32-15 50-15s30 10 50 15c18 5 36 4 64-1 38-7 74-3 116 13v130H14z"
          fill="#fff" fill-opacity=".16"/>
    <path d="M14 332c42-16 78-20 116-13 28 5 46 6 64 1 20-5 32-15 50-15s30 10 50 15c18 5 36 4 64-1 38-7 74-3 116 13"
          fill="none" stroke="#fff" stroke-opacity=".34" stroke-width="2"/>

    <!-- корень под десной -->
    <path d="M198 332h84l-11 88c-2 18-13 30-31 30s-29-12-31-30z" fill="#fff" fill-opacity=".12"/>

    <!-- культя: обточенный зуб с плоской площадкой и уступом -->
    <path d="M188 332l6-64c1-13 12-22 26-24h40c14 2 25 11 26 24l6 64z" fill="url(#cr-st)"/>
    <path d="M188 332l6-64c1-13 12-22 26-24h40c14 2 25 11 26 24l6 64" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5"/>
    <path d="M178 332h124" stroke="#fff" stroke-opacity=".8" stroke-width="6" stroke-linecap="round"/>

    <!-- стрелка посадки -->
    <g stroke="#fff" stroke-opacity=".85" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M240 190v24" stroke-dasharray="6 8"/>
      <path d="M228 205l12 13 12-13"/>
    </g>

    <!-- коронка: полый колпачок с жевательными буграми -->
    <g>
      <path d="M162 158c-9-52 7-92 37-105 17-7 29 11 41 27 8 12 20 12 28 0 12-16 24-34 41-27 30 13 46 53 37 105z"
            fill="url(#cr-en)"/>
      <ellipse cx="240" cy="158" rx="78" ry="17" fill="#0C3125" fill-opacity=".85"/>
      <ellipse cx="240" cy="158" rx="78" ry="17" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2.5"/>
      <path d="M162 158c-9-52 7-92 37-105 17-7 29 11 41 27 8 12 20 12 28 0 12-16 24-34 41-27 30 13 46 53 37 105"
            fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2.5"/>
      <g stroke="#5CBF92" stroke-opacity=".45" stroke-width="3.5" stroke-linecap="round" fill="none">
        <path d="M216 68c9 12 30 12 39 0"/><path d="M240 78v58"/>
      </g>
      <path d="M190 62c-10 13-15 36-13 62" stroke="#fff" stroke-opacity=".8" stroke-width="9" stroke-linecap="round" fill="none"/>
    </g>

  </g>
  <circle cx="240" cy="240" r="214" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="5 9"/>
</svg>
