<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Противопоказания: список ограничений, которые врач проверяет на консультации">
  <title>Противопоказания</title>
  <defs><clipPath id="fit"><circle cx="240" cy="240" r="212"/></clipPath></defs>

  <circle cx="240" cy="240" r="214" fill="#fff" opacity=".07"/>
  <g clip-path="url(#fit)">
  <g transform="translate(240,240) scale(1.2) translate(-240,-240)">


  <!-- ================= карта пациента ================= -->
  <g>
    <rect x="96" y="104" width="230" height="288" rx="20" fill="#fff" stroke="#fff" stroke-width="2.5"/>
    <!-- зажим планшета -->
    <rect x="176" y="86" width="70" height="34" rx="14" fill="#93E7BE" stroke="#fff" stroke-width="2.5"/>

    <!-- пункты чек-листа -->
    <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
      <!-- допустимо -->
      <g transform="translate(128,170)">
        <circle cx="0" cy="0" r="13" fill="#0C7A55" fill-opacity=".16"/>
        <path d="M-6 0 -2 5 6-5" fill="none" stroke="#0C7A55" stroke-opacity=".8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="26" y="-5" width="130" height="9" rx="4.5" fill="#0C7A55" fill-opacity=".22"/>
      </g>
      <g transform="translate(128,214)">
        <circle cx="0" cy="0" r="13" fill="#0C7A55" fill-opacity=".16"/>
        <path d="M-6 0 -2 5 6-5" fill="none" stroke="#0C7A55" stroke-opacity=".8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="26" y="-5" width="106" height="9" rx="4.5" fill="#0C7A55" fill-opacity=".22"/>
      </g>
      <!-- требует внимания -->
      <g transform="translate(128,258)">
        <circle cx="0" cy="0" r="13" fill="#FF5A2B" fill-opacity=".18"/>
        <path d="M0-6v5M0 4v1" stroke="#FF5A2B" stroke-opacity=".9" stroke-width="3.2" stroke-linecap="round"/>
        <rect x="26" y="-5" width="140" height="9" rx="4.5" fill="#FF5A2B" fill-opacity=".3"/>
      </g>
      <g transform="translate(128,302)">
        <circle cx="0" cy="0" r="13" fill="#FF5A2B" fill-opacity=".18"/>
        <path d="M0-6v5M0 4v1" stroke="#FF5A2B" stroke-opacity=".9" stroke-width="3.2" stroke-linecap="round"/>
        <rect x="26" y="-5" width="118" height="9" rx="4.5" fill="#FF5A2B" fill-opacity=".3"/>
      </g>
      <g transform="translate(128,346)">
        <circle cx="0" cy="0" r="13" fill="#0C7A55" fill-opacity=".16"/>
        <path d="M-6 0 -2 5 6-5" fill="none" stroke="#0C7A55" stroke-opacity=".8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="26" y="-5" width="150" height="9" rx="4.5" fill="#0C7A55" fill-opacity=".22"/>
      </g>
    </g>
  </g>

  <!-- ================= знак внимания ================= -->
  <g transform="translate(352,320)">
    <path d="M0-64c7 0 13 4 16 10l52 92c7 12-2 26-16 26h-104c-14 0-23-14-16-26l52-92c3-6 9-10 16-10z"
