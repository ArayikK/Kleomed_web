<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Цены: прайс-лист клиники с расчётом стоимости лечения">
  <title>Цены</title>
  <defs><clipPath id="fit"><circle cx="240" cy="240" r="212"/></clipPath></defs>

  <circle cx="240" cy="240" r="214" fill="#fff" opacity=".07"/>
  <g clip-path="url(#fit)">
  <g transform="translate(240,240) scale(1.2) translate(-240,-240)">


  <!-- ================= прайс-лист ================= -->
  <g>
    <!-- лист с оторванным нижним краем -->
    <path d="M126 108h196c11 0 20 9 20 20v244l-20-13-20 13-20-13-20 13-20-13-20 13-20-13-20 13-20-13-20 13V128c0-11 9-20 20-20z"
          fill="#fff" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- шапка -->
    <rect x="126" y="108" width="216" height="52" rx="20" fill="#0C7A55" fill-opacity=".14"/>
    <rect x="126" y="140" width="216" height="20" fill="#0C7A55" fill-opacity=".14"/>
    <text x="196" y="142" fill="#0C7A55" fill-opacity=".85"
          font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="800">Прайс-лист</text>

    <!-- строки прайса -->
    <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" font-weight="600">
      <g fill="#0C7A55" fill-opacity=".55">
        <rect x="152" y="190" width="86" height="9" rx="4.5"/>
        <rect x="152" y="226" width="110" height="9" rx="4.5"/>
        <rect x="152" y="262" width="72" height="9" rx="4.5"/>
        <rect x="152" y="298" width="98" height="9" rx="4.5"/>
        <rect x="152" y="334" width="80" height="9" rx="4.5"/>
      </g>
      <g fill="#0C7A55" fill-opacity=".9" text-anchor="end">
        <text x="316" y="200">3 500 ₽</text>
        <text x="316" y="236">30 000 ₽</text>
        <text x="316" y="272">18 000 ₽</text>
        <text x="316" y="308">45 000 ₽</text>
        <text x="316" y="344">12 000 ₽</text>
      </g>
      <g stroke="#0C7A55" stroke-opacity=".14" stroke-width="1.5" stroke-dasharray="2 5">
        <path d="M152 212h164"/><path d="M152 248h164"/><path d="M152 284h164"/><path d="M152 320h164"/>
      </g>
    </g>
  </g>

  <!-- ================= печать «консультация бесплатно» ================= -->
  <g transform="translate(240,378) rotate(-9) scale(.72)">
    <rect x="-88" y="-26" width="176" height="52" rx="26" fill="none" stroke="#fff" stroke-width="3.4"/>
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#fff"/>
    <text x="0" y="6" text-anchor="middle" fill="#0C7A55"
          font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="900">КОНСУЛЬТАЦИЯ 0 ₽</text>
  </g>

  <!-- ================= зуб-маркер ================= -->
  <g transform="translate(126,128)">
    <circle cx="0" cy="0" r="30" fill="#93E7BE" stroke="#fff" stroke-width="3"/>
    <path d="M-13-14c-5 0-10 5-10 11 0 5 1 8 3 11 2 3 3 6 3 11 0 4 1 7 3 7s3-3 4-7l2-7c0-2 1-3 2-3s2 1 2 3l2 7c1 4 2 7 4 7s3-3 3-7c0-5 1-8 3-11 2-3 3-6 3-11 0-6-5-11-10-11-2 0-4 1-5 1-1 1-2 1-3 1s-2 0-3-1c-1 0-3-1-5-1z"
          fill="#0A4D38" fill-opacity=".8"/>
  </g>

  </g>
  </g>
  <circle cx="240" cy="240" r="214" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="5 9"/>
</svg>
