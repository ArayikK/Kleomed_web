<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Несъёмный протез челюсти на четырёх имплантах">
  <title>Протезирование на имплантах</title>
  <defs>
    <clipPath id="fit"><circle cx="240" cy="240" r="212"/></clipPath>
    <linearGradient id="a4-en" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#D5EEE2"/>
    </linearGradient>
    <linearGradient id="a4-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A6EEC8"/><stop offset="1" stop-color="#5FC496"/>
    </linearGradient>
    <!-- имплант: конический винт, начало координат — центр платформы -->
    <g id="a4-s">
      <rect x="-9" y="-26" width="18" height="26" rx="4" fill="#BFF2D8"/>
      <path d="M-16 0h32l-4 62c-1 11-6 18-12 18s-11-7-12-18z" fill="#A6EEC8" stroke="#fff" stroke-opacity=".8" stroke-width="2" stroke-linejoin="round"/>
      <g stroke="#0A4D38" stroke-opacity=".45" stroke-width="3" stroke-linecap="round">
        <path d="M-13 12h26"/><path d="M-12 26h24"/><path d="M-11 40h22"/><path d="M-9 54h18"/>
      </g>
    </g>
  </defs>

  <circle cx="240" cy="240" r="214" fill="#fff" opacity=".07"/>
  <g clip-path="url(#fit)">

    <!-- кость челюсти -->
    <path d="M10 306c46-22 88-32 140-35 52-3 128-3 180 0 52 3 94 13 140 35v160H10z" fill="#fff" fill-opacity=".13"/>
    <path d="M10 306c46-22 88-32 140-35 52-3 128-3 180 0 52 3 94 13 140 35v22c-46-22-88-32-140-35-52-3-128-3-180 0-52 3-94 13-140 35z"
          fill="#fff" fill-opacity=".14"/>
    <path d="M10 306c46-22 88-32 140-35 52-3 128-3 180 0 52 3 94 13 140 35"
          fill="none" stroke="#fff" stroke-opacity=".36" stroke-width="2"/>
    <g fill="#fff" fill-opacity=".16">
      <circle cx="60" cy="372" r="5"/><circle cx="122" cy="402" r="3.5"/><circle cx="176" cy="376" r="5"/>
      <circle cx="240" cy="404" r="4"/><circle cx="304" cy="376" r="5"/><circle cx="358" cy="402" r="3.5"/>
      <circle cx="420" cy="372" r="5"/><circle cx="92" cy="346" r="3"/><circle cx="388" cy="346" r="3"/>
      <circle cx="208" cy="350" r="3"/><circle cx="272" cy="350" r="3"/><circle cx="146" cy="424" r="3"/>
      <circle cx="334" cy="424" r="3"/>
    </g>

    <!-- четыре импланта: задние наклонены, как в методике All-on-4 -->
    <g transform="translate(96,300) rotate(-28)"><use href="#a4-s"/></g>
    <g transform="translate(188,292)"><use href="#a4-s"/></g>
    <g transform="translate(292,292)"><use href="#a4-s"/></g>
    <g transform="translate(384,300) rotate(28)"><use href="#a4-s"/></g>

    <!-- базис протеза -->
    <path d="M36 272c50-34 102-48 204-48s154 14 204 48c6 16 2 28-10 32-50-22-100-30-194-30s-144 8-194 30c-12-4-16-16-10-32z"
          fill="url(#a4-base)" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- зубной ряд протеза -->
    <g fill="url(#a4-en)" stroke="#fff" stroke-opacity=".6" stroke-width="2">
      <g transform="translate(76,250) rotate(-20)"><path d="M-25 0h50c7 0 12 5 11 12l-5 34c-2 17-10 27-31 27s-29-10-31-27l-5-34c-1-7 4-12 11-12z" transform="scale(1,-1)"/></g>
      <g transform="translate(130,232) rotate(-13)"><path d="M-25 0h50c7 0 12 5 11 12l-5 34c-2 17-10 27-31 27s-29-10-31-27l-5-34c-1-7 4-12 11-12z" transform="scale(1,-1)"/></g>
      <g transform="translate(186,222) rotate(-6)"><path d="M-25 0h50c7 0 12 5 11 12l-5 34c-2 17-10 27-31 27s-29-10-31-27l-5-34c-1-7 4-12 11-12z" transform="scale(1,-1)"/></g>
      <g transform="translate(240,219)"><path d="M-25 0h50c7 0 12 5 11 12l-5 34c-2 17-10 27-31 27s-29-10-31-27l-5-34c-1-7 4-12 11-12z" transform="scale(1,-1)"/></g>
      <g transform="translate(294,222) rotate(6)"><path d="M-25 0h50c7 0 12 5 11 12l-5 34c-2 17-10 27-31 27s-29-10-31-27l-5-34c-1-7 4-12 11-12z" transform="scale(1,-1)"/></g>
      <g transform="translate(350,232) rotate(13)"><path d="M-25 0h50c7 0 12 5 11 12l-5 34c-2 17-10 27-31 27s-29-10-31-27l-5-34c-1-7 4-12 11-12z" transform="scale(1,-1)"/></g>
      <g transform="translate(404,250) rotate(20)"><path d="M-25 0h50c7 0 12 5 11 12l-5 34c-2 17-10 27-31 27s-29-10-31-27l-5-34c-1-7 4-12 11-12z" transform="scale(1,-1)"/></g>
    </g>

  </g>
  <circle cx="240" cy="240" r="214" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="5 9"/>
</svg>
