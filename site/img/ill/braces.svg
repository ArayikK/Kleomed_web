<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Брекеты с дугой на зубном ряду">
  <title>Ортодонтия — брекет-системы</title>
  <defs>
    <clipPath id="fit"><circle cx="240" cy="240" r="212"/></clipPath>
    <linearGradient id="br-en" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#D8EFE3"/>
    </linearGradient>
    <!-- зуб ряда: начало координат — середина верхнего края -->
    <path id="br-t" d="M-31 0h62c8 0 14 6 13 14l-7 74c-2 24-14 38-37 38s-35-14-37-38l-7-74c-1-8 5-14 13-14z"/>
    <!-- брекет с пазом под дугу -->
    <g id="br-b">
      <rect x="-17" y="-15" width="34" height="30" rx="8" fill="#8FE3B8"/>
      <rect x="-17" y="-15" width="34" height="30" rx="8" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2"/>
      <path d="M-17 0h34" stroke="#0A4D38" stroke-opacity=".5" stroke-width="5"/>
      <g fill="#0A4D38" fill-opacity=".35">
        <circle cx="-9" cy="-8" r="2.6"/><circle cx="9" cy="-8" r="2.6"/>
        <circle cx="-9" cy="8" r="2.6"/><circle cx="9" cy="8" r="2.6"/>
      </g>
    </g>
  </defs>

  <circle cx="240" cy="240" r="214" fill="#fff" opacity=".07"/>
  <g clip-path="url(#fit)">

    <!-- десна -->
    <path d="M14 176c44-18 82-26 128-29 46-3 102-3 148 0 46 3 84 11 128 29V20H14z" fill="#fff" fill-opacity=".16"/>
    <path d="M14 176c44-18 82-26 128-29 46-3 102-3 148 0 46 3 84 11 128 29"
          fill="none" stroke="#fff" stroke-opacity=".34" stroke-width="2"/>

    <!-- зубной ряд: зубы с зазорами, один развёрнут -->
    <g fill="url(#br-en)" stroke="#fff" stroke-opacity=".55" stroke-width="2">
      <g transform="translate(84,196) rotate(-6)"><use href="#br-t"/></g>
      <g transform="translate(152,184) rotate(-3)"><use href="#br-t"/></g>
      <g transform="translate(220,178)"><use href="#br-t"/></g>
      <g transform="translate(290,180) rotate(11)"><use href="#br-t"/></g>
      <g transform="translate(358,186) rotate(4)"><use href="#br-t"/></g>
      <g transform="translate(424,198) rotate(7)"><use href="#br-t"/></g>
    </g>

    <!-- дуга -->
    <path d="M52 268c60-16 122-23 188-23s128 7 188 23"
          fill="none" stroke="#8FE3B8" stroke-width="7" stroke-linecap="round"/>
    <path d="M52 268c60-16 122-23 188-23s128 7 188 23"
          fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2.5" stroke-linecap="round"/>

    <!-- брекеты -->
    <g transform="translate(84,258) rotate(-6)"><use href="#br-b"/></g>
    <g transform="translate(152,250) rotate(-3)"><use href="#br-b"/></g>
    <g transform="translate(220,246)"><use href="#br-b"/></g>
    <g transform="translate(290,248) rotate(7)"><use href="#br-b"/></g>
    <g transform="translate(358,252) rotate(4)"><use href="#br-b"/></g>
    <g transform="translate(424,260) rotate(7)"><use href="#br-b"/></g>

  </g>
  <circle cx="240" cy="240" r="214" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="5 9"/>
</svg>
