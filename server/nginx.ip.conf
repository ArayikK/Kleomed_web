# КЛЕОМЕД — конфигурация на время работы по IP-адресу.
#
# Домен клеомед.рф пока показывает на старый сайт (Tilda), поэтому сертификата
# нет и HTTPS не поднять. Но жить на этом конфиге предстоит не один день, а
# сайт тяжёлый по картинкам — поэтому здесь есть всё, что не требует домена:
# сжатие, кеш статики, защитные заголовки.
#
# Когда домен переедет сюда: выпустить сертификат и поставить nginx.conf.sample.

# Пока сайт открывается по IP, поисковикам его отдавать нельзя: иначе адрес
# 109.172.36.124 попадёт в выдачу и будет конкурировать с клеомед.рф за одни
# и те же тексты. На самом домене заголовок пустой и не мешает индексации.
map $host $kleomed_robots {
    default                        "noindex, nofollow";
    xn--d1abasfhn.xn--p1ai         "";
    www.xn--d1abasfhn.xn--p1ai     "";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name xn--d1abasfhn.xn--p1ai www.xn--d1abasfhn.xn--p1ai _;

    root /var/www/kleomed/site;
    index index.html;
    charset utf-8;

    add_header X-Robots-Tag           $kleomed_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 512;

    # ------------------------------------------------------------- заявки
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------- опрос со стороны IDENT
    location ~ ^/(GetTickets|GetOngoingCalls|GetFinishedCalls|PostTimeTable)$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8081;
        access_log off;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------ статика
    # Картинки и шрифты не меняются — их держим в кеше браузера месяц.
    location ~* \.(woff2|png|jpe?g|webp|svg|ico)$ {
        add_header Cache-Control          "public, max-age=2592000";
        add_header X-Robots-Tag           $kleomed_robots always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Стили и скрипты правим часто, а имена файлов без хеша: месячный кеш
    # означал бы, что после правки люди ещё месяц видят старый сайт.
    # Час — компромисс: повторные заходы быстрые, правка доезжает за час.
    location ~* \.(css|js)$ {
        add_header Cache-Control          "public, max-age=3600, must-revalidate";
        add_header X-Robots-Tag           $kleomed_robots always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Адрес с Tilda, куда уводила старая форма. У нас окно «спасибо» на месте.
    location = /thankyoupage {
        return 301 /;
    }

    # Редиректа .html -> /без-расширения здесь намеренно нет: ссылки внутри
    # страниц идут с расширением, и такой редирект добавил бы лишний переход
    # на каждый клик. Обе формы адреса работают напрямую.
    location / {
        # Сами страницы не кешируем: сайт ещё правится, и человек, зашедший
        # второй раз, должен увидеть свежую версию, а не вчерашнюю из кеша.
        # Весит страница мало, стили и картинки всё равно берутся из кеша.
        add_header Cache-Control          "no-cache";
        add_header X-Robots-Tag           $kleomed_robots always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    access_log /var/log/nginx/kleomed.access.log;
    error_log  /var/log/nginx/kleomed.error.log;
}
